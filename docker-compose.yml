services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production

      - Telegram__Enabled=${TELEGRAM_ENABLED:-false}
      - Telegram__Token=${TELEGRAM_TOKEN}
      - Telegram__WebhookUrl=${TELEGRAM_WEBHOOK_URL}

      - Max__Enabled=${MAX_ENABLED:-false}
      - Max__Token=${MAX_TOKEN}
      - Max__TimeoutSeconds=${MAX_TIMEOUT_SECONDS:-30}

      - Data__UseDatabase=${DATA_USE_DATABASE:-true}
      - Data__ConnectionString=${DATA_CONNECTION_STRING}
    expose:
      - "8080"
