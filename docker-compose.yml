services:
  api:
    build:
      context: external/ref-info-api
      dockerfile: Dockerfile
    restart: always
    ports:
      - "5131:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION_STRING}
      - Jwt__Issuer=${JWT_ISSUER:-RefInfoAPI}
      - Jwt__Audience=${JWT_AUDIENCE:-RefInfoAPIClient}
      - Jwt__Key=${JWT_KEY:-REPLACE_THIS_WITH_A_STRONG_SECRET_KEY_32CHARS_MIN}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    depends_on:
      - api
    environment:
      - ASPNETCORE_ENVIRONMENT=Production

      - Telegram__Enabled=${TELEGRAM_ENABLED:-false}
      - Telegram__Token=${TELEGRAM_TOKEN}
      - Telegram__WebhookUrl=${TELEGRAM_WEBHOOK_URL}

      - Max__Enabled=${MAX_ENABLED:-false}
      - Max__Token=${MAX_TOKEN}
      - Max__TimeoutSeconds=${MAX_TIMEOUT_SECONDS:-30}

      # Связь бота с сервисом API по внутренней сети Docker
      - Data__Source=${DATA_SOURCE:-api}
      - RefInfoApi__BaseUrl=${REFINFOAPI__BASEURL:-http://api:8080}
      - RefInfoApi__Username=${REFINFOAPI__USERNAME:-}
      - RefInfoApi__Password=${REFINFOAPI__PASSWORD:-}
    expose:
      - "8080"

